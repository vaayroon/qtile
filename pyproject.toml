[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtile-config"
version = "0.36.0"
description = "Custom Qtile tiling window manager configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qtile",
    "cairocffi",
    "xcffib",
    "aiohttp",
    "psutil",
    "dbus-fast",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pip-tools",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ARG",  # unused arguments
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "modules", "settings", "utils"]

[tool.mypy]
python_version = "3.12"
strict = false
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true

# Librerías sin stubs (qtile y sus dependencias)
[[tool.mypy.overrides]]
module = [
    "libqtile.*",
    "cairocffi.*",
    "xcffib.*",
    "dbus_fast.*",
]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
searchPaths = ["src"]
reportUnknownMemberType = "none"
reportUnknownFunctionType = "none"
reportUnknownArgumentType = "none"