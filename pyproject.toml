[project]
name = "qtile-config"
# Mirrors the pinned Qtile version (the README banner uses the same number).
version = "0.37.1"
description = "Custom Qtile tiling window manager configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qtile==0.37.1",  # the WM; exact pin, config and tests rely on libqtile internals
    "cairocffi",      # qtile core dependency (bar drawing)
    "xcffib",         # qtile core dependency (X11 backend)
    "aiohttp",        # qtile widgets extra: gen_poll_url (CryptoTicker)
    "psutil",         # qtile widgets extra: Memory/Net/Sensors
    "dbus-fast",      # qtile optional-core: notification server / D-Bus
    "python-dotenv",  # src/settings.py loads .env
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pre-commit>=4.4.0"]

[tool.uv]
package = false                             # deps only: no build, no editable install
python-preference = "only-system"           # venv must use distro /usr/bin/python3.12
environments = ["sys_platform == 'linux'"]  # X11-only config
required-version = ">=0.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ARG",  # unused arguments
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "modules", "settings", "utils"]

[tool.mypy]
python_version = "3.12"
strict = false
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true

# Librerías sin stubs (qtile y sus dependencias)
[[tool.mypy.overrides]]
module = [
    "libqtile.*",
    "cairocffi.*",
    "xcffib.*",
    "dbus_fast.*",
]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
searchPaths = ["src"]
reportUnknownMemberType = "none"
reportUnknownFunctionType = "none"
reportUnknownArgumentType = "none"