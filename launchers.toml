# App launcher registry: apps spawned by a key combo.
#
# Each `[[launcher]]` table binds one command to one or more combos:
#   name     required, unique: a letter or digit, then letters, digits, . _ -
#   command  required, run without a shell (split like a command line)
#   keys     required, combos such as "mod+alt+e", "ctrl+1" or "XF86Explorer";
#            modifiers: mod (the config's mod key), alt, ctrl, shift
#   desc     optional, shown in the README tables and the mod+F1 cheat sheet
#
# The terminal (mod+Return), dmenu (mod+Shift+Return) and the rofi app menu
# stay hard-coded in src/modules/keys.py, so a broken registry never takes
# them away. A combo some other key already uses is skipped with a warning
# in qtile.log, and so is the mod+s scratchpad chord leader.
#
# Add your own launchers in `launchers.local.toml` (gitignored) instead of
# editing this file. A local entry with a shipped name REPLACES it in full,
# `enabled = false` removes it, and a new name adds a launcher. Reload with
# mod+Shift+r. See README.md > Launchers.

[[launcher]]
name = "virtual-shell"
command = "kitty --title virtual-shell"
keys = ["mod+alt+Return"]
desc = "Launches Virtual Kitty"

