# Dedicated kitty configuration for the Qtile scratchpad dropdown terminal.
#
# This terminal is summoned/dismissed with a single keybind (Super+º) or
# from rofi. It is intentionally tuned differently from the everyday terminal:
# a touch of transparency, generous padding and no decorations so it reads as a
# floating "quake-style" popup rather than a normal window.
#
# Loaded via:  kitty --class scratchpad-term --config <this file>

# --- Appearance ---------------------------------------------------------------
font_family       CaskaydiaCove Nerd Font
font_size         10.0

# No title bar / borders — Qtile owns the framing of the floating window.
hide_window_decorations  yes

# Breathing room around the text.
window_padding_width     10

# Subtle transparency so it feels like an overlay. Qtile's DropDown opacity
# stacks on top of this; keep this near-opaque for readability.
background_opacity        0.95
dynamic_background_opacity yes

# --- Behaviour ----------------------------------------------------------------
# A scratchpad is ephemeral — don't nag on close and don't restore old sizes.
confirm_os_window_close   0
remember_window_size      no

# Keep the cursor lively while the popup is focused.
cursor_blink_interval     0.5

tab_bar_style powerline

inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

# --- Colors (Vaayroon style, matches the #117af0 accent in settings.py) ------
cursor_shape          Underline
cursor_underline_thickness 1
window_padding_width  20

# Special
foreground #a9b1d6
background #1a1b26

# Black
color0 #414868
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #73daca
color10 #73daca

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #c0caf5
color15 #c0caf5

# Cursor
cursor #117af0
cursor_text_color #1a1b26

# Selection highlight
selection_foreground #7aa2f7
selection_background #28344a
